name: Bug report
description: Report a reproducible problem in mdFOAM Density Analyzer
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not attach private keys, passwords, unpublished experimental data, or full simulation cases.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
      placeholder: The analyzer fails when...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest workflow that reproduces the issue.
      placeholder: |
        1. Start the app with `python app.py`
        2. Select ...
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include traceback text if available.
    validations:
      required: true
  - type: dropdown
    id: input-source
    attributes:
      label: Input source
      options:
        - Local folder
        - SSH/SFTP
        - Both
        - Not sure
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, etc.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: Python 3.12.4
  - type: input
    id: density-field
    attributes:
      label: Density field
      placeholder: rhoM_water
  - type: textarea
    id: minimal-data
    attributes:
      label: Minimal data or structure
      description: Use synthetic data, a small directory tree, or short OpenFOAM ASCII snippets. Do not upload full case data.
      render: text
  - type: textarea
    id: verification
    attributes:
      label: Additional context
      description: Include screenshots or logs only if they do not contain secrets or private research data.
