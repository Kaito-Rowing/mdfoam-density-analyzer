<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      text { font-family: "Yu Gothic", "Noto Sans JP", sans-serif; fill: #172033; }
      .title { font-size: 38px; font-weight: 700; }
      .heading { font-size: 27px; font-weight: 700; }
      .label { font-size: 21px; }
      .small { font-size: 17px; }
      .note { font-size: 19px; }
      .panel { fill: #fbfdff; stroke: #244f91; stroke-width: 3; rx: 18; }
      .substrate { fill: #8b929c; stroke: #4f5660; stroke-width: 2; }
      .water { fill: #a9d8ff; stroke: #1764b0; stroke-width: 2; }
      .tracked { fill: #ff6961; stroke: #ad201b; stroke-width: 3; }
      .vapor { fill: #eef4fa; stroke: #60738a; stroke-width: 2; }
      .cluster-link { fill: none; stroke: #7fb9e8; stroke-width: 2; }
      .time-arrow { stroke: #314d6b; stroke-width: 4; marker-end: url(#arrow); }
      .guide { stroke: #ad201b; stroke-width: 2.5; stroke-dasharray: 8 7; }
      .vacuum { stroke: #087f8c; stroke-width: 3; stroke-dasharray: 12 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#314d6b"/>
    </marker>
    <g id="droplet">
      <rect class="substrate" x="0" y="190" width="245" height="24"/>
      <g class="cluster-link">
        <path d="M35 185 L60 150 L88 177 L115 138 L145 174 L177 145 L211 184"/>
        <path d="M60 150 L85 112 L115 138 L145 100 L177 145"/>
        <path d="M85 112 L120 75 L145 100 L176 115"/>
      </g>
      <g class="water">
        <circle cx="35" cy="185" r="11"/><circle cx="60" cy="150" r="11"/>
        <circle cx="88" cy="177" r="11"/><circle cx="115" cy="138" r="11"/>
        <circle cx="145" cy="174" r="11"/><circle cx="177" cy="145" r="11"/>
        <circle cx="211" cy="184" r="11"/><circle cx="85" cy="112" r="11"/>
        <circle cx="145" cy="100" r="11"/><circle cx="176" cy="115" r="11"/>
        <circle cx="120" cy="75" r="11"/>
      </g>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="800" y="58" text-anchor="middle" class="title">分子離脱の判定模式図</text>

  <rect x="35" y="90" width="965" height="640" class="panel"/>
  <text x="70" y="135" class="heading">A　クラスタ外に3保存時刻連続</text>

  <g transform="translate(70 205)">
    <text x="122" y="-25" text-anchor="middle" class="heading">t₀</text>
    <use href="#droplet"/>
    <circle class="tracked" cx="120" cy="75" r="13"/>
    <text x="122" y="250" text-anchor="middle" class="label">液滴主クラスタ内</text>
  </g>
  <g transform="translate(365 205)">
    <text x="122" y="-25" text-anchor="middle" class="heading">t₁</text>
    <use href="#droplet"/>
    <circle class="tracked" cx="120" cy="18" r="13"/>
    <text x="122" y="250" text-anchor="middle" class="label">クラスタ外 1時刻目</text>
  </g>
  <g transform="translate(660 205)">
    <text x="122" y="-25" text-anchor="middle" class="heading">t₂</text>
    <use href="#droplet"/>
    <circle class="tracked" cx="120" cy="-5" r="13"/>
    <text x="122" y="250" text-anchor="middle" class="label">クラスタ外 2時刻目</text>
  </g>
  <g transform="translate(805 480)">
    <circle class="tracked" cx="0" cy="0" r="13"/>
    <text x="25" y="-3" class="label">t₃：クラスタ外 3時刻目</text>
    <text x="25" y="30" class="heading" fill="#ad201b">→ 確定離脱</text>
  </g>

  <line x1="320" y1="310" x2="350" y2="310" class="time-arrow"/>
  <line x1="615" y1="310" x2="645" y2="310" class="time-arrow"/>
  <line x1="185" y1="280" x2="185" y2="570" class="guide"/>
  <text x="70" y="605" class="label" fill="#ad201b">最後のクラスタ内位置：離脱高さの推定位置</text>
  <path d="M190 630 Q330 660 485 630" fill="none" stroke="#ad201b" stroke-width="3"/>
  <text x="340" y="690" text-anchor="middle" class="label">実際の離脱は t₀ と t₁ の間</text>

  <rect x="1025" y="90" width="540" height="640" class="panel" style="stroke:#087f8c"/>
  <text x="1060" y="135" class="heading">B　次時刻以降に分子データから消失</text>
  <line x1="1055" y1="190" x2="1535" y2="190" class="vacuum"/>
  <text x="1525" y="178" text-anchor="end" class="label">真空境界</text>

  <g transform="translate(1080 280)">
    <text x="122" y="-25" text-anchor="middle" class="heading">t₀</text>
    <use href="#droplet"/>
    <circle class="tracked" cx="120" cy="75" r="13"/>
  </g>
  <line x1="1335" y1="390" x2="1380" y2="390" class="time-arrow"/>
  <g transform="translate(1385 280)">
    <text x="85" y="-25" text-anchor="middle" class="heading">t₁</text>
    <rect class="substrate" x="0" y="190" width="170" height="24"/>
    <g class="water">
      <circle cx="30" cy="185" r="10"/><circle cx="55" cy="150" r="10"/>
      <circle cx="82" cy="178" r="10"/><circle cx="105" cy="140" r="10"/>
      <circle cx="135" cy="178" r="10"/><circle cx="80" cy="112" r="10"/>
    </g>
  </g>
  <text x="1295" y="545" text-anchor="middle" class="label">追跡分子が以後の positions に存在しない</text>
  <rect x="1130" y="575" width="335" height="58" rx="12" fill="#e9f7f7" stroke="#087f8c" stroke-width="3"/>
  <text x="1298" y="613" text-anchor="middle" class="heading">確定離脱：escaped_domain</text>
  <text x="1295" y="675" text-anchor="middle" class="small">3時刻連続の確認は待たない</text>
  <text x="1295" y="705" text-anchor="middle" class="small">消失理由そのものは、このデータだけでは判定しない</text>

  <rect x="35" y="755" width="1530" height="110" rx="16" fill="#f6f8fb" stroke="#8b98aa" stroke-width="2"/>
  <g transform="translate(65 785)">
    <circle class="water" cx="15" cy="15" r="11"/>
    <line x1="30" y1="15" x2="62" y2="15" class="cluster-link"/>
    <circle class="water" cx="77" cy="15" r="11"/>
    <text x="100" y="22" class="note">分子間距離 ≤ クラスタ距離（標準 0.40 nm）なら連結</text>
    <circle class="tracked" cx="680" cy="15" r="12"/>
    <text x="705" y="22" class="note">追跡分子</text>
    <circle class="vapor" cx="885" cy="15" r="11"/>
    <text x="910" y="22" class="note">主クラスタ外</text>
  </g>
  <text x="800" y="842" text-anchor="middle" class="note">
    離脱高さは原則として、最後に液滴主クラスタ内だった位置から算出
  </text>
</svg>
